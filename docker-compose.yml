services:
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn agents.research_agent:app --host 0.0.0.0 --port 8001
    environment:
      A2A_API_KEY: ${A2A_API_KEY:-change-me}
    ports:
      - "8001:8001"

  writer-agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn agents.writer_agent:app --host 0.0.0.0 --port 8002
    environment:
      A2A_API_KEY: ${A2A_API_KEY:-change-me}
    ports:
      - "8002:8002"

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn supervisor.app:app --host 0.0.0.0 --port 8000
    environment:
      A2A_API_KEY: ${A2A_API_KEY:-change-me}
      RESEARCH_URL: http://research-agent:8001
      WRITER_URL: http://writer-agent:8002
    depends_on:
      - research-agent
      - writer-agent
    ports:
      - "8000:8000"
